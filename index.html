        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .login-container {
            background: white;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 420px;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #ff6200;
            box-shadow: 0 6px 20px rgba(255, 98, 0, 0.35);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background-color: #f5f7fa;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff6200;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(255, 98, 0, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff6200;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #e55a00;
        }
        .info-text {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }
    </style>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Användarnamn</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Lösenord</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Logga in</button>
        </form>
        <p class="info-text">
            Om du är medlem och inte har tillgång till CAD-systemet,<br>
            vänligen hör av dig till en i ledningen.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
           
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) return;
            
            fetch(`https://${GetParentResourceName()}/loginAttempt`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });
        });
    </script>
